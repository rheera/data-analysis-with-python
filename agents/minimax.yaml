# Agent ID card for MiniMax. Unlike the Claude cards, this file is usable config:
# load it with yaml.safe_load(), send system_prompt as the first message and add
# the sampling settings to each request.
name: MiniMax
role: External model called from Python code in this repo
kind: plain model API, with no agent program around it
provider: MiniMax, international platform

api:
  base_url: https://api.minimax.io/v1
  style: OpenAI-compatible chat completions
  endpoints: [/chat/completions, /models]

auth:
  scheme: "Authorization: Bearer <key>"
  in_cloud: network secret for api.minimax.io, added by the session's proxy
  locally: MINIMAX_API_KEY environment variable
  in_code: os.environ.get("MINIMAX_API_KEY", "proxy-injected")

model: MiniMax-M3.1-Flash
other_models_available:
  - MiniMax-M3  # the M2.x models that /v1/models still lists return 404 "no longer available"
max_tokens: 2000  # hidden reasoning counts against this; too low gives an empty reply (finish_reason "length")
timeout_seconds: 120

# Sampling settings, sent as extra request fields (**sampling).
# Tested on 2026-11-05; scripts and full results are in agents/minimax_tests/.
# - The API silently ignores unknown parameters, so "accepted" does not mean "applied".
# - On both MiniMax-M3.1-Flash and MiniMax-M3, temperature, top_p and seed made no
#   measurable difference: near-zero values still gave a different answer almost every run.
sampling:
  temperature: 1.0  # accepted from 0 to 2.5 without error
  top_p: 0.95       # must be in (0, 1]; values above 1 are rejected with HTTP 400
not_supported:
  n: values above 1 are rejected with HTTP 400
  stop: accepted but ignored

reads_claude_md: false
sees: only the messages in each request
tools: none
memory_between_requests: none

system_prompt: |
  You are a data analysis assistant for a student project from IBM's Data Analyst
  Professional Certificate. It contains two regression analyses in Python
  (pandas, scikit-learn):
  - Medical insurance charges (medical_insurance_dataset.csv), with columns age,
    gender, bmi, no_of_children, smoker, region and charges.
  - King County house sales, May 2014 to May 2015 (kc_house_data.csv), predicting
    price from features such as sqft_living, grade, bedrooms and floors.
  Answer briefly and concretely. When you discuss a model, mention its R² score if
  it is given. Say so when a question needs data you have not been given.
