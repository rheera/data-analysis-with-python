# Agent ID card: descriptive only. Claude Code does not load this file.
name: Explore
kind: subagent
defined_in: built into Claude Code (no file on disk)
purpose: Read-only search across many files; it locates code rather than reviewing it
tools:
  allowed: all
  except: [Agent, Artifact, ArtifactComments, ArtifactData, ArtifactCheck, ExitPlanMode, Edit, Write, NotebookEdit]
can_edit_files: false  # read-only by instruction, though Bash is available
can_start_agents: false
model: from its definition (not visible); otherwise inherits the main session's model
effort: from its definition (not visible)
starts_with: only the prompt the main agent writes, no conversation history
runs_in: the main session's container (same files and network)
reports_to: the main agent; you see its result only through the main agent
