# Agent ID card: descriptive only. Claude Code does not load this file.
name: claude
kind: subagent
defined_in: provided by Claude Code for this session (no file on disk)
purpose: Catch-all for tasks that don't fit a more specific agent; the default when no agent type is named
tools: all
